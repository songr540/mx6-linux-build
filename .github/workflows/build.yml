name: build-mx6-kernel

on:
  # 只保留手动触发：避免每推一个文件就触发一次构建（会产生一堆失败邮件）
  workflow_dispatch:

concurrency:
  group: build-mx6
  cancel-in-progress: true

jobs:
  build:
    # 公开仓库免费的原生 arm64 4vCPU/16GB runner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
                                     device-tree-compiler rsync cpio kmod ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G"     >> $GITHUB_ENV
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x620-${{ github.run_id }}
          restore-keys: |
            ccache-x620-

      - name: Fetch mt6797-mainline kernel
        run: |
          git clone --depth 1 https://github.com/mt6797-mainline/linux.git "$RUNNER_TEMP/linux"
          cd "$RUNNER_TEMP/linux"
          git log -1 --format='KERNEL_HEAD %H %ad %s' --date=short

      - name: Apply board files (X620 base)
        run: |
          K="$RUNNER_TEMP/linux"
          gunzip -c rootfs/bin/busybox.gz > rootfs/bin/busybox
          chmod +x rootfs/init rootfs/bin/busybox

          # 照抄 mt6797-mainline 的板级 dts，仅把 simplefb 基址换成本机实测值
          cp board/mt6797-leeco-x620-mx6.dts "$K/arch/arm64/boot/dts/mediatek/"
          MK="$K/arch/arm64/boot/dts/mediatek/Makefile"
          grep -q "mt6797-leeco-x620-mx6" "$MK" || \
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt6797-leeco-x620-mx6.dtb' >> "$MK"

          # 照抄它自带的 defconfig
          cp "$K/arch/arm64/configs/mt6797_x620.config" "$K/.config"
          sh config/apply-x620.sh "$K"
          cd "$K"
          scripts/config --file .config --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs"
          make ARCH=arm64 olddefconfig >/dev/null
          echo '===== effective config ====='
          for k in CONFIG_CMDLINE CONFIG_INITRAMFS_SOURCE CONFIG_DEBUG_INFO_BTF \
                   CONFIG_USB_MTU3 CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_ACM \
                   CONFIG_PHY_MT6797_LK_USB CONFIG_COMMON_CLK_MT6797_LK_INFRA \
                   CONFIG_FB_SIMPLE CONFIG_FRAMEBUFFER_CONSOLE CONFIG_PSTORE_RAM; do
            printf '%-38s %s\n' "$k" "$(grep -E "^$k=|^# $k is not set" .config | head -1)"
          done

      - name: Build Image.gz
        run: |
          K="$RUNNER_TEMP/linux"
          cd "$K"
          echo "=== env ==="
          nproc; free -m | head -2; df -h . | tail -1; gcc --version | head -1
          echo "=== build ==="
          if ! make -j"$(nproc)" ARCH=arm64 Image.gz > build.log 2>&1 ; then
            echo "########## BUILD FAILED ##########"
            grep -nE "error:|Error [0-9]|undefined|No such file|No space|Killed|fatal" build.log | tail -30
            echo "---------- last 40 ----------"
            tail -40 build.log
            exit 1
          fi
          tail -5 build.log
          ls -l arch/arm64/boot/Image.gz
          echo "=== ccache ==="
          ccache -s | head -12

      - name: Build dtbs
        run: |
          K="$RUNNER_TEMP/linux"
          cd "$K"
          if ! make ARCH=arm64 dtbs > dtbs.log 2>&1 ; then
            echo "########## DTBS FAILED ##########"
            tail -40 dtbs.log
            exit 1
          fi
          ls -l arch/arm64/boot/dts/mediatek/*x620-mx6*.dtb

      - name: Collect
        run: |
          K="$RUNNER_TEMP/linux"
          mkdir -p out
          cp "$K/arch/arm64/boot/Image.gz" out/
          cp "$K/arch/arm64/boot/dts/mediatek/mt6797-leeco-x620-mx6.dtb" out/ 2>/dev/null || true
          cp "$K/.config" out/config-built.txt
          ls -l out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mx6-6x-x620base
          path: out/
          retention-days: 30
